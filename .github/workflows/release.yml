name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # One semantic version for everything: 0.1.0 -> 0.1.1 -> 0.1.2 ...
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -e
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="0.1.0"
          else
            IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
            NEXT="$MAJ.$MIN.$((PAT + 1))"
          fi
          echo "latest tag: ${LATEST:-none} -> next: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Pinned to Tauri's MSRV: the deprecated `screenshots` crate used for
      # capture fails to build on newer Rust (Linux-only inference error).
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Apply version
        shell: bash
        run: node scripts/set-version.mjs "$VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "Bantrol v${{ env.VERSION }}"
          releaseBody: |
            Bantrol — Twój komputer pod ręką.

            Automatyczny build z commita `${{ github.sha }}`.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  mobile:
    name: Mobile · Android
    needs: [version, desktop]
    # Build the APK even if a desktop platform fails, so a release always has
    # the mobile app.
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default installs the long-removed `tools` package, which fails.
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # The Tauri Android template uses compileSdk 37 (platform "android-37.0")
          # and AGP 9.3, which needs build-tools 36.0.0.
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only arm64-v8a: it covers virtually every modern phone and is by far
          # the biggest factor in keeping the APK small.
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./mobile/src-tauri -> target"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Apply version
        shell: bash
        run: node scripts/set-version.mjs "$VERSION"

      - name: Prepare Android project
        working-directory: mobile
        run: npm run tauri android init

      # Gradle signs debug APKs with ~/.android/debug.keystore and generates a
      # fresh random one on every runner. A new key means Android refuses the
      # self-update with INSTALL_FAILED_UPDATE_INCOMPATIBLE, so use one stable
      # keystore for every build.
      - name: Use stable debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp mobile/android/bantrol-debug.keystore "$HOME/.android/debug.keystore"
          # Older AGP setups read the debug key from ANDROID_SDK_HOME instead.
          if [ -n "$ANDROID_SDK_HOME" ] && [ "$ANDROID_SDK_HOME" != "$HOME" ]; then
            mkdir -p "$ANDROID_SDK_HOME/.android"
            cp mobile/android/bantrol-debug.keystore "$ANDROID_SDK_HOME/.android/debug.keystore"
          fi

      # Make sure the launcher icon is the Bantrol logo, regardless of what the
      # generated project ships with.
      - name: Apply Bantrol launcher icon
        run: |
          RES=mobile/src-tauri/gen/android/app/src/main/res
          cp -R mobile/src-tauri/icons/android/. "$RES/"
          find "$RES" -name 'ic_launcher*' | sort

      # The generated project already allows cleartext traffic for debug builds
      # (manifestPlaceholders[usesCleartextTraffic] = "true"), which is what the
      # phone needs to reach the desktop over the local network.
      - name: Build Android APK
        working-directory: mobile
        run: npm run tauri android build -- --apk --debug --target aarch64

      - name: Collect APK
        run: |
          APK=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK" Bantrol-Android.apk
          ls -lh Bantrol-Android.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Bantrol $TAG" \
              --notes "Bantrol — Twój komputer pod ręką." || true
          fi
          gh release upload "$TAG" Bantrol-Android.apk --clobber

  web:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install landing dependencies
        working-directory: front
        run: npm ci
      - name: Build landing
        working-directory: front
        run: npm run build
