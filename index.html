<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bantrol-app-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bantrol — steruj komputerem z telefonu przez lokalne Wi-Fi."
    />
    <link
      rel="preload"
      href="/fonts/Caladea-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Bantrol — pilot komputera przez Wi-Fi</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("bantrol.theme") || "system";
          const dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
