[package]
name = "bantrol-mobile"
version = "0.1.0"
description = "Bantrol — pilot komputera na telefonie"
authors = ["Bantrol"]
edition = "2021"

[lib]
name = "bantrol_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The plugin is Android-only at runtime but compiles as a stub elsewhere, which
# keeps its permissions known to the capability checker on every target.
tauri-plugin-android-installer = "0.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# The APK we ship is a debug build, so keep it small: no debug info, no
# symbols and size-oriented optimisation. Without this the .so carries full
# debug data and the APK balloons into hundreds of MB.
[profile.dev]
debug = false
strip = true
opt-level = "z"
incremental = false
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
